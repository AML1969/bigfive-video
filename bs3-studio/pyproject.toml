[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bs3-studio"
version = "3.0.0a1"
description = "BS Profiler 3.0: Big Five plus emotion, voice, facial-expression and speech analytics from a video. Separate project from bs 1.0 (own package, port, work dir)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bs3 = "bs3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bs3*"]

[tool.setuptools.package-data]
bs3 = ["*.json", "mm/*.csv"]
